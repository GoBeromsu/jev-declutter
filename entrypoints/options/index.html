<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="manifest.open_in_tab" content="true" />
  <title>Jev Declutter 설정</title>
  <style>
    :root {
      color-scheme: light dark;
      --font-sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --text-xs: 12px;
      --text-sm: 13px;
      --text-md: 14px;
      --text-lg: 17px;
      --text-xl: 30px;
      --leading: 1.55;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-pill: 999px;
      --line: 1px;
      --control-height: 38px;
      --rail: 200px;
      --page-max: 960px;
      --ease: 160ms ease;
      --color-bg: #f4f1ea;
      --color-surface: #fffdf8;
      --color-surface-2: #f7f3ea;
      --color-ink: #1c1b17;
      --color-ink-2: #5f5b52;
      --color-ink-3: #8b867b;
      --color-line: #e4dfd3;
      --color-line-2: #cdc6b6;
      --color-accent: #cf3f1b;
      --color-accent-ink: #fff8f3;
      --color-accent-soft: #fbe7de;
      --color-ok: #2f7a4f;
      --color-ok-soft: #e1f1e6;
      --color-warn: #9c6410;
      --color-warn-soft: #f8ecd4;
      --color-danger: #b3261e;
      --color-danger-soft: #f9e3e1;
      --shadow-1: 0 1px 2px rgba(28, 27, 23, 0.06), 0 8px 24px -16px rgba(28, 27, 23, 0.25);
      --focus-ring: 0 0 0 3px var(--color-accent-soft);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #16150f;
        --color-surface: #1f1d17;
        --color-surface-2: #27241b;
        --color-ink: #efe9dc;
        --color-ink-2: #aba496;
        --color-ink-3: #7d776b;
        --color-line: #34301f;
        --color-line-2: #4b4533;
        --color-accent: #ff7a4d;
        --color-accent-ink: #1c1b17;
        --color-accent-soft: #4a2416;
        --color-ok: #6fcf97;
        --color-ok-soft: #1f3a2a;
        --color-warn: #e5b45b;
        --color-warn-soft: #3d3014;
        --color-danger: #ff8a80;
        --color-danger-soft: #4a1f1c;
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px -16px rgba(0, 0, 0, 0.8);
      }
    }

    * { box-sizing: border-box; }
    html { background: var(--color-bg); }
    body {
      margin: 0;
      font: var(--text-md) / var(--leading) var(--font-sans);
      color: var(--color-ink);
      background: radial-gradient(60% 40% at 100% 0%, var(--color-accent-soft), transparent 70%) no-repeat, var(--color-bg);
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: var(--page-max); margin: 0 auto; padding: var(--space-7) var(--space-5); }

    .masthead {
      display: grid;
      grid-template-columns: var(--rail) 1fr;
      gap: var(--space-5);
      align-items: end;
      margin-bottom: var(--space-6);
    }
    .brand {
      margin: 0;
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-accent);
    }
    h1 { margin: var(--space-1) 0 0; font-size: var(--text-xl); line-height: 1.1; letter-spacing: -0.02em; }

    .card {
      display: grid;
      grid-template-columns: var(--rail) 1fr;
      gap: var(--space-5);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
      background: var(--color-surface);
      border: var(--line) solid var(--color-line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-1);
    }
    .card > header h2 { margin: 0 0 var(--space-1); font-size: var(--text-lg); letter-spacing: -0.01em; }
    .card > header p { margin: 0; font-size: var(--text-sm); color: var(--color-ink-2); }
    .card > .body { display: grid; align-content: start; gap: var(--space-4); min-width: 0; }

    .field { display: grid; gap: var(--space-1); min-width: 0; }
    .field > label { font-size: var(--text-sm); font-weight: 600; color: var(--color-ink-2); }
    .field > .hint { font-size: var(--text-xs); color: var(--color-ink-3); }
    input[type="text"], input[type="password"], select {
      width: 100%;
      height: var(--control-height);
      padding: 0 var(--space-3);
      font: inherit;
      color: var(--color-ink);
      background: var(--color-surface);
      border: var(--line) solid var(--color-line-2);
      border-radius: var(--radius-sm);
      transition: border-color var(--ease), box-shadow var(--ease);
    }
    input[type="password"] { font-family: var(--font-mono); letter-spacing: 0.08em; }
    input::placeholder { color: var(--color-ink-3); }
    input:focus-visible, select:focus-visible, .btn:focus-visible {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: var(--focus-ring);
    }
    input[type="checkbox"], input[type="radio"] { width: 16px; height: 16px; margin: 0; accent-color: var(--color-accent); }

    .note {
      margin: 0;
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-sm);
      color: var(--color-ink-2);
      background: var(--color-warn-soft);
      border-left: 3px solid var(--color-warn);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    .check-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); }
    .check {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--control-height);
      padding: 0 var(--space-3);
      font-weight: 600;
      border: var(--line) solid var(--color-line);
      border-radius: var(--radius-sm);
      background: var(--color-surface-2);
      cursor: pointer;
      transition: border-color var(--ease), background-color var(--ease);
    }
    .check:has(input:checked) { border-color: var(--color-accent); background: var(--color-accent-soft); }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-6); }
    .btn {
      height: var(--control-height);
      padding: 0 var(--space-4);
      font: inherit;
      font-weight: 700;
      color: var(--color-ink);
      background: var(--color-surface);
      border: var(--line) solid var(--color-line-2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color var(--ease), border-color var(--ease), transform var(--ease);
    }
    .btn:hover { background: var(--color-surface-2); }
    .btn:active { transform: translateY(1px); }
    .btn-primary { color: var(--color-accent-ink); background: var(--color-accent); border-color: var(--color-accent); }
    .btn-primary:hover { background: var(--color-accent); filter: brightness(0.94); }
    .btn-row { height: auto; padding: 2px var(--space-3); font-size: var(--text-sm); font-weight: 600; }
    .status { font-size: var(--text-sm); color: var(--color-ink-2); }
    .status[data-state="saved"], .status[data-state="reset"] { color: var(--color-ok); }
    .status[data-state="error"] { color: var(--color-danger); }

    .budget {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: var(--space-2) var(--space-4);
      margin: 0;
      font-size: var(--text-sm);
      color: var(--color-ink-2);
    }
    .budget strong { font-size: var(--text-lg); color: var(--color-ink); font-variant-numeric: tabular-nums; }
    .budget code { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-ink); overflow-wrap: anywhere; }

    .diag { padding: var(--space-4) 0 0; border-top: var(--line) solid var(--color-line); }
    .diag-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
    .diag h3 { margin: 0; font-size: var(--text-md); }
    .tag { font-size: var(--text-xs); font-weight: 700; line-height: 1.4; padding: 1px var(--space-2); border-radius: var(--radius-pill); }
    .tag-fresh { color: var(--color-ok); background: var(--color-ok-soft); }
    .tag-stale { color: var(--color-warn); background: var(--color-warn-soft); }
    .tag-none { color: var(--color-ink-3); background: var(--color-surface-2); }
    .meta { margin: var(--space-1) 0 var(--space-3); font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-ink-2); overflow-wrap: anywhere; }
    .empty { margin: 0 0 var(--space-2); font-size: var(--text-sm); color: var(--color-ink-3); }
    table { width: 100%; margin-bottom: var(--space-2); border-collapse: collapse; font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
    th, td { padding: var(--space-2) var(--space-3); text-align: left; vertical-align: top; border-bottom: var(--line) solid var(--color-line); }
    th { font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.04em; color: var(--color-ink-3); }
    .key { font-family: var(--font-mono); font-size: var(--text-xs); overflow-wrap: anywhere; }
    .num { width: 6em; text-align: right; }

    @media (max-width: 720px) {
      .page { padding: var(--space-5) var(--space-4); }
      .masthead, .card { grid-template-columns: 1fr; gap: var(--space-4); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .masthead, .card { animation: rise 360ms cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    }
    form:has(#model option[value^="openai:"]:checked) .key-typesafe,
    form:has(#model option[value^="typesafe:"]:checked) .key-openai { display: none; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .check { justify-content: center; position: relative; }
    .check input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .check svg { width: 26px; height: 26px; color: var(--color-ink-3); transition: color var(--ease); }
    .check:has(input:checked) svg { color: var(--color-ink); }
    .check:has(input:focus-visible) { box-shadow: var(--focus-ring); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: var(--control-height); font-weight: 600; }
    .row.locked { color: var(--color-ink-2); }
    .switch { appearance: none; width: 40px !important; height: 22px !important; border-radius: var(--radius-pill); background: var(--color-line-2); position: relative; cursor: pointer; transition: background-color var(--ease); }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--color-surface); transition: transform var(--ease); }
    .switch:checked { background: var(--color-accent); }
    .switch:checked::after { transform: translateX(18px); }
    .switch:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div>
        <p class="brand">Jev Declutter</p>
        <h1>설정</h1>
      </div>
    </header>

    <form id="settings" novalidate>
      <section class="card" style="--i: 1" aria-labelledby="h-model">
        <header><h2 id="h-model">모델</h2></header>
        <div class="body">
          <select id="model" aria-labelledby="h-model">
            <option value="openai:gpt-6-luna">OpenAI · gpt-6-luna</option>
            <option value="typesafe:jev-latest">Jev · jev-latest</option>
          </select>
          <div class="field key-openai">
            <label for="openai-key">OpenAI API 키</label>
            <input id="openai-key" type="password" autocomplete="off" spellcheck="false" />
          </div>
          <div class="field key-typesafe">
            <label for="typesafe-key">Jev API 키</label>
            <input id="typesafe-key" type="password" autocomplete="off" spellcheck="false" />
          </div>
          <p class="note">키는 이 프로필에 평문 저장 · 모델에는 구조와 UI 라벨만 전송</p>
        </div>
      </section>

      <section class="card" style="--i: 2" aria-labelledby="h-sites">
        <header><h2 id="h-sites">사이트</h2></header>
        <div class="body">
          <div class="check-grid">
            <label class="check" title="YouTube"><input type="checkbox" id="site-youtube" checked /><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9v6l5-3z" fill="var(--color-surface)"/></svg><span class="sr">YouTube</span></label>
            <label class="check" title="X"><input type="checkbox" id="site-x" checked /><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="sr">X</span></label>
            <label class="check" title="Instagram"><input type="checkbox" id="site-instagram" checked /><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg><span class="sr">Instagram</span></label>
            <label class="check" title="LinkedIn"><input type="checkbox" id="site-linkedin" checked /><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/><path d="M7 10v7M7 7v.01M11 17v-7m0 3.5a3 3 0 0 1 6 0V17" stroke="var(--color-surface)" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg><span class="sr">LinkedIn</span></label>
          </div>
        </div>
      </section>

      <section class="card" style="--i: 3" aria-labelledby="h-feed">
        <header><h2 id="h-feed">피드</h2></header>
        <div class="body">
          <div class="row locked"><span>광고</span><span class="tag tag-none">항상 숨김</span></div>
          <label class="row"><span>추천 · 팔로우하지 않은 계정</span><input type="checkbox" id="hide-suggested" class="switch" checked /></label>
        </div>
      </section>

      <div class="toolbar">
        <button type="submit" id="save" class="btn btn-primary">저장</button>
        <button type="button" id="reset" class="btn">오늘 캐시 비우기</button>
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </div>
    </form>

    <section class="card" style="--i: 4" aria-labelledby="h-diag">
      <header>
        <h2 id="h-diag">오늘의 판정</h2>
        <p>모델 요청 예산과 사이트별 판정 캐시</p>
      </header>
      <div class="body">
        <p id="budget" class="budget"></p>
        <div id="diagnostics"></div>
      </div>
    </section>

    <section class="card" style="--i: 5" aria-labelledby="h-overrides">
      <header>
        <h2 id="h-overrides">직접 응답</h2>
        <p>블러 위에서 누른 예 / 아니오. 모델 판정보다 우선합니다.</p>
      </header>
      <div class="body">
        <p id="override-summary" class="budget"></p>
        <div id="overrides"></div>
        <div class="toolbar">
          <button type="button" id="override-clear-all" class="btn">응답 모두 지우기</button>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="../../src/options.ts"></script>
</body>
</html>
